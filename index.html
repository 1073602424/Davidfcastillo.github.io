<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acompañamiento Jurídico | David Castillo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #202735;
      line-height: 1.6;
    }

    header {
      background: #17243a;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
      margin: 0;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 65px 20px;
    }

    .hero h2 {
      font-size: 28px;
      color: #17243a;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 750px;
      margin: 0 auto 25px;
      font-size: 18px;
      color: #555;
    }

    .boton {
      display: inline-block;
      background: #c49a3a;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 7px;
      font-weight: bold;
      margin-top: 10px;
    }

    .boton:hover {
      opacity: 0.9;
    }

    section {
      padding: 55px 20px;
    }

    section > h2 {
      text-align: center;
      color: #17243a;
      margin-bottom: 35px;
      font-size: 28px;
    }

    .servicios {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card h3 {
      color: #17243a;
      margin-bottom: 10px;
      font-size: 19px;
    }

    .card p {
      color: #555;
    }

    .como-funciona {
      background: #17243a;
      color: white;
    }

    .como-funciona h2 {
      color: white;
    }

    .pasos {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .paso {
      background: rgba(255, 255, 255, 0.08);
      padding: 22px;
      border-radius: 8px;
    }

    .paso h3 {
      margin-bottom: 10px;
      color: white;
    }

    .paso p {
      color: #e5e5e5;
    }

    .contacto {
      background: white;
      text-align: center;
    }

    .contacto p {
      max-width: 700px;
      margin: 0 auto;
    }

    .aviso {
      margin-top: 30px !important;
      font-size: 14px;
      color: #666;
      max-width: 800px !important;
    }

    footer {
      background: #111a2b;
      color: #ccd2dc;
      text-align: center;
      padding: 25px 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .hero h2 {
        font-size: 28px;
      }

      .hero p {
        font-size: 17px;
      }

      section {
        padding: 45px 18px;
      }

      section > h2 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>⚖️ Acompañamiento Jurídico</h1>
    <p>Apoyo en redacción, revisión y organización documental</p>
  </header>

  <div class="hero">
    <h2>Apoyo jurídico-documental claro y organizado.</h2>
